name: Release

on:
  push:
    tags: [ 'v*' ]
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [ 'x86_64', 'arm64', 'armv6', 'armv6_rpi' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Compile binary
        run: |
          mkdir -p /tmp/out
          ./crosscompile.sh ${{ matrix.variant }}
          mv go-librespot-${{ matrix.variant }} go-librespot
          tar -zcvf /tmp/out/go-librespot_linux_${{ matrix.variant }}.tar.gz go-librespot README.md

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.variant }}
          path: /tmp/out
          retention-days: 7

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Install MinGW and decode libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-mpg123
          path-type: inherit

      - name: Configure CGO for MSYS2
        run: |
          {
            echo "CC=$(cygpath -m "$(command -v gcc)")"
            echo "PKG_CONFIG=$(cygpath -m "$(command -v pkg-config)")"
            echo "PKG_CONFIG_PATH=$(cygpath -m /mingw64/lib/pkgconfig)"
          } >> "$GITHUB_ENV"
          # libogg.dll.a omits ogg_stream_iovecin; force -logg onto libogg.a.
          if [ -f /mingw64/lib/libogg.dll.a ]; then
            mv /mingw64/lib/libogg.dll.a /mingw64/lib/libogg.dll.a.unused
          fi

      - name: Compile Windows binary
        env:
          CGO_ENABLED: 1
        run: |
          export PATH="/mingw64/bin:${PATH}"
          mkdir -p out
          go build -o go-librespot.exe -ldflags "-s -w" ./cmd/daemon
          tar -zcvf out/go-librespot_windows_amd64.tar.gz go-librespot.exe README.md

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows_amd64
          path: out
          retention-days: 7

  publish:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - build-windows
    steps:
      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: /tmp/out
          merge-multiple: true

      - name: Generate changelog
        uses: jaywcjlove/changelog-generator@main
        id: changelog
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filter-author: (dependabot|renovate\\[bot\\]|dependabot\\[bot\\]|Renovate Bot)
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'

      - name: Release binaries
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ${{ steps.changelog.outputs.compareurl }}
            ${{ steps.changelog.outputs.changelog }}
          files: /tmp/out/*
