dir: '{{.InterfaceDir}}'
structname: Mock{{.InterfaceName}}
pkgname: '{{.SrcPackageName}}'
filename: "mock_{{.InterfaceName}}.go"
template: testify
template-data:
  mock-build-tags: test_unit || test_integration
  unroll-variadic: true
packages:
  github.com/devgianlu/go-librespot:
    interfaces:
      AudioSource:
      Logger:
      PageResolver:
      StateStore:
  github.com/devgianlu/go-librespot/output:
    interfaces:
      Output:
  github.com/devgianlu/go-librespot/player:
    interfaces:
      EventManager:
  github.com/devgianlu/go-librespot/tracks:
    interfaces:
      ContextResolver:
  github.com/devgianlu/go-librespot/zeroconf:
    interfaces:
      ServiceRegistrar:
